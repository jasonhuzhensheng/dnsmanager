name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: LedgerCore tests
        working-directory: LedgerCore
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          DEVELOPMENT_TEAM="" xcodegen generate

      # CI 上不签名：没有 iCloud 权限，App 会走「退回本地存储」那条路径，正好一起验证。
      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild -project DNSManager.xcodeproj -scheme DNSManager-macOS -destination 'platform=macOS' \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO ENABLE_CLOUDKIT=NO build | tee build-macos.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-macos.log

      - name: Pick iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Build iOS (simulator)
        run: |
          set -o pipefail
          xcodebuild -project DNSManager.xcodeproj -scheme DNSManager-iOS -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO ENABLE_CLOUDKIT=NO build | tee build-ios.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-ios.log

      - name: Launch on iOS simulator
        run: |
          udid=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl ui "$udid" appearance light
          xcrun simctl install "$udid" build/DD/Build/Products/Debug-iphonesimulator/DNSManager.app
          out=$(xcrun simctl launch --stdout="$PWD/ios-run.log" --stderr="$PWD/ios-run.log" "$udid" com.jasonhu.dnsmanager -seedSamples)
          echo "$out"
          pid=${out##*: }
          sleep 25
          xcrun simctl io "$udid" screenshot ios-1-launch.png
          # 模拟器里的 App 就是宿主机上的一个进程，进程号还在说明没有崩溃。
          if ps -p "$pid" > /dev/null; then echo "iOS app still running"; else echo "iOS app exited"; cat ios-run.log; exit 1; fi
          xcrun simctl ui "$udid" appearance dark
          sleep 3
          xcrun simctl io "$udid" screenshot ios-2-dark.png

      - name: Launch on macOS
        run: |
          app=build/DD/Build/Products/Debug/DNSManager.app
          "$app/Contents/MacOS/DNSManager" -seedSamples > macos-run.log 2>&1 &
          pid=$!
          sleep 25
          screencapture -x macos.png || true
          if kill -0 "$pid"; then echo "macOS app still running"; kill "$pid"; else echo "macOS app exited"; cat macos-run.log; exit 1; fi

      - name: Crash logs
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*DNSManager* 2>/dev/null | head -2); do head -120 "$f"; done
          tail -50 ios-run.log macos-run.log 2>/dev/null || true

      # 编写环境下载不了 Actions 产物，把截图和诊断推到 ci-artifacts 分支，用 git 取回。
      - name: Publish screenshots and diagnostics
        if: always()
        run: |
          out=$(mktemp -d)
          cp *.png ios-run.log macos-run.log "$out"/ 2>/dev/null || true
          grep -hE "(error|warning):" build-macos.log build-ios.log 2>/dev/null | sed "s|$PWD/||" | sort -u > "$out/diagnostics.txt" || true
          cd "$out"
          git init -q -b ci-artifacts
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-logs
          path: |
            *.png
            *.log
          if-no-files-found: ignore
